<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" fill="none" className="w-full h-full">
  <defs>
    <!-- Primary Teal Glow for Swarm Intelligence -->
    <filter id="tealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#0ab1ba" flood-opacity="0.45"/>
    </filter>
    <!-- Cyan Secondary Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00f5d4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- TRAILING TRANSIT WAVE 2 (LOWER CYAN / TRANSIT ACCENT LINE) -->
  <path 
    d="M 76 198 L 96 172 L 180 172 C 196 172 208 162 216 148 C 224 134 220 120 228 110 L 232 104" 
    stroke="#00f5d4" 
    stroke-width="11" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#cyanGlow)"
  />

  <!-- TRAILING TRANSIT WAVE 1 (UPPER BRAND TEAL #0ab1ba LINE) -->
  <path 
    d="M 64 176 L 86 150 L 170 150 C 186 150 198 140 206 126 C 214 112 210 98 218 88 L 222 82" 
    stroke="#0ab1ba" 
    stroke-width="11" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#tealGlow)"
  />

  <!-- MAIN BOT HEAD (CRISP WHITE GEOMETRY WITH CHAT BUBBLE TAIL & EARS) -->
  <g filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))">
    <!-- Outer Speech Bubble / Bot Body Path -->
    <path 
      d="
        M 86 42 
        C 86 34, 94 28, 104 28 
        L 156 28 
        C 166 28, 174 34, 174 42
        C 180 42, 186 46, 188 52
        L 196 52
        C 202 52, 206 58, 206 66
        L 206 88
        C 206 96, 202 102, 196 102
        L 188 102
        C 186 108, 180 112, 174 112
        C 174 124, 166 132, 154 132
        L 76 132
        L 48 162
        L 48 122
        C 38 120, 32 112, 32 102
        L 24 102
        C 18 102, 14 96, 14 88
        L 14 66
        C 14 58, 18 52, 24 52
        L 32 52
        C 34 46, 40 42, 46 42
        Z
      " 
      fill="#FFFFFF"
      stroke="#E2E8F0"
      stroke-width="1.5"
    />

    <!-- DARK COMMAND CENTER VISOR -->
    <rect 
      x="40" 
      y="48" 
      width="140" 
      height="62" 
      rx="18" 
      fill="#0E1117" 
      stroke="rgba(255,255,255,0.08)"
      stroke-width="1"
    />

    <!-- LEFT OVAL EYE -->
    <rect 
      x="74" 
      y="63" 
      width="20" 
      height="32" 
      rx="10" 
      fill="#FFFFFF"
    />

    <!-- RIGHT OVAL EYE -->
    <rect 
      x="126" 
      y="63" 
      width="20" 
      height="32" 
      rx="10" 
      fill="#FFFFFF"
    />
  </g>
</svg>
